<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Eats with Pete — Walk the street</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Baloo+2:wght@400;500;700&display=swap">
<link rel="stylesheet" href="css/style.css">
<script src="js/early-init.js"></script>
</head>
<body>

<div class="loading-screen" id="loadingScreen" role="status" aria-live="polite">
  <img id="loadingPeteImg" src="" alt="">
  <div class="loading-label pixel">Loading...</div>
</div>

<h2 style="position:absolute;left:-9999px;">Eats with Pete: scroll down to walk Pete along the street, past the logo signpost, then loop back to the start</h2>

<div class="scroll-space" id="scrollSpace">
  <div class="viewport">
    <div class="track" id="track">

      <div class="margin" id="leadMargin">
        <div class="logo-prop"><h1 class="pixel">Eats<br>with<br>Pete</h1></div>
      </div>

      <div class="scene" id="scene">
        <img class="bg" id="bgImg" src="assets/images/bg_scene.jpg" alt="the street">

        <!-- ===================================================================
             STOREFRONT CONFIG — positions eyeballed from the actual art
             (percentages of the full background width). Add new
             <a class="storefront" style="left:X%;" href="..." data-label="...">LABEL</a>
             entries here once real assets/links are ready.
        ==================================================================== -->

        <div class="carrot-prop" id="carrotProp">
          <img id="carrotImg" src="" alt="Carrot peddler">
        </div>

        <!-- Banana stand — purely decorative background element, ambient
             loop, positioned in the gap right of the "Club Sandwich" sign
             on La Belle Province's storefront (~65.9% of the art width) -->
        <img class="banana-stand-prop" id="bananaStandImg" src="" alt="">

        <!-- Lost and Found — clicking opens a popup that plays the video.
             PLACEHOLDER icon (assets/images/lost_and_found_icon_placeholder.svg)
             — swap the src for real art whenever it's ready, no code changes
             needed. Sits on the blank grey wall panel right of Schwartz's,
             before the Garage sign. -->
        <img class="lost-found-icon" id="lostFoundIcon" src="assets/images/lost_and_found_icon_placeholder.svg" alt="Lost and Found" role="button" tabindex="0">



<audio id="hotdogSound" src="assets/audio/hotdog_sound.mp3" preload="auto"></audio>
<!-- Placeholder for the carrot peddler's click sound bite — drop the base64 src in here once it's ready -->
<!-- Carrot peddler click-sound cycle: gotthestuff -> lazerwave -> gotthestuff -> ... -->
<audio id="carrotSound1" src="assets/audio/carrot_sound_1.mp3" preload="auto"></audio>
<audio id="carrotSound2" src="assets/audio/carrot_sound_2.mp3" preload="auto"></audio>
<!-- Looping background ambience track -->
<audio id="heyManSound" src="assets/audio/hey_man_sound.mp3" preload="auto"></audio>

<audio id="ambienceSound" src="assets/audio/ambience_sound.mp3" loop preload="auto"></audio>
<audio id="bananaStandSound" src="assets/audio/banana_stand_sound.mp3" preload="auto"></audio>

      </div>

      <div class="margin" id="trailMargin">
        <div class="logo-prop"><h1 class="pixel">Eats<br>with<br>Pete</h1></div>
      </div>

    </div>
  </div>
</div>

<div class="pete" id="pete">
  <img id="peteImg" src="" alt="Pete walking">
</div>

<div class="cart-prop">
  <img src="assets/images/cart_prop.png" alt="hot dog cart">
</div>


<button id="muteBtn" class="pixel" aria-label="Mute sound" title="Mute sound">🔊</button>

<div class="video-modal" id="lostFoundModal" aria-hidden="true">
  <div class="video-modal-backdrop" id="lostFoundBackdrop"></div>
  <div class="video-modal-content">
    <button class="video-modal-close" id="lostFoundClose" aria-label="Close">&times;</button>
    <video id="lostFoundVideo" src="assets/video/lost_and_found.mp4" controls playsinline></video>
  </div>
</div>

<div class="hint" id="hint">scroll to walk →</div>

<footer class="pixel">THAT'S THE END OF THE STREET. KEEP SCROLLING TO LOOP BACK.</footer>

<script src="js/main.js"></script>

</body>
</html>
